name: Windows EXE Derle

on:
  push:
    branches: [main, master, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: EXE derle
        run: npx electron-builder --win portable nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Sürüm etiketi
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: OguzlarFis-Windows
          path: |
            dist/OguzlarFis-Tasinabilir.exe
            dist/OguzlarFis-Kurulum.exe

      - name: Release oluştur (indirilebilir EXE)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Oğuzlar Fiş ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **İndir ve çalıştır:**
            - `OguzlarFis-Tasinabilir.exe` → kurulum gerektirmez, çift tıklayıp açın.
            - `OguzlarFis-Kurulum.exe` → masaüstü kısayolu ile bilgisayara kurar.

            Windows "bilinmeyen yayıncı" uyarısı verirse: **Ek bilgi → Yine de çalıştır**.
          files: |
            dist/OguzlarFis-Tasinabilir.exe
            dist/OguzlarFis-Kurulum.exe
